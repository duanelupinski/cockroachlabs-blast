# Local insecure MCP demo: 3× us-east, one node per zone.
# Never start this with TLS. Demos use --insecure only.
x-node: &node
  image: cockroachdb/cockroach:${CRDB_VERSION:-v26.1.5}
  labels:
    - "managed-by=cockroach-blast"
    - "blast-demo=mcp"
  networks:
    - blast-net
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 3s
    timeout: 3s
    retries: 20

services:
  blast-node-1:
    <<: *node
    container_name: blast-node-1
    hostname: blast-node-1
    command: >
      start --insecure
      --join=blast-node-1:26357,blast-node-2:26357,blast-node-3:26357
      --listen-addr=0.0.0.0:26357 --advertise-addr=blast-node-1:26357
      --sql-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --store=node1
      --locality=region=us-east,zone=us-east-1
      --cache=64MiB --max-sql-memory=256MiB

  blast-node-2:
    <<: *node
    container_name: blast-node-2
    hostname: blast-node-2
    command: >
      start --insecure
      --join=blast-node-1:26357,blast-node-2:26357,blast-node-3:26357
      --listen-addr=0.0.0.0:26357 --advertise-addr=blast-node-2:26357
      --sql-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --store=node2
      --locality=region=us-east,zone=us-east-2
      --cache=64MiB --max-sql-memory=256MiB

  blast-node-3:
    <<: *node
    container_name: blast-node-3
    hostname: blast-node-3
    command: >
      start --insecure
      --join=blast-node-1:26357,blast-node-2:26357,blast-node-3:26357
      --listen-addr=0.0.0.0:26357 --advertise-addr=blast-node-3:26357
      --sql-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --store=node3
      --locality=region=us-east,zone=us-east-3
      --cache=64MiB --max-sql-memory=256MiB

  blast-init:
    image: cockroachdb/cockroach:${CRDB_VERSION:-v26.1.5}
    container_name: blast-init
    labels:
      - "managed-by=cockroach-blast"
      - "blast-demo=mcp"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cockroach init --insecure --host=blast-node-1:26357 || true
        sleep 3
        cockroach sql --insecure --host=blast-node-1:26357 -e "
          GRANT admin TO root;
          SET CLUSTER SETTING sql.restrict_system_interface.enabled = false;
        "
    depends_on:
      blast-node-1:
        condition: service_healthy
      blast-node-2:
        condition: service_healthy
      blast-node-3:
        condition: service_healthy
    networks:
      - blast-net

  blast-lb:
    image: haproxy:2.9
    container_name: blast-lb
    labels:
      - "managed-by=cockroach-blast"
      - "blast-demo=mcp"
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - ./haproxy-mcp.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - blast-net
    depends_on:
      blast-node-1:
        condition: service_healthy
      blast-node-2:
        condition: service_healthy
      blast-node-3:
        condition: service_healthy

  blast-workload:
    image: cockroachdb/cockroach:${CRDB_VERSION:-v26.1.5}
    container_name: blast-workload
    hostname: blast-workload
    labels:
      - "managed-by=cockroach-blast"
      - "blast-demo=mcp"
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    networks:
      - blast-net

networks:
  blast-net:
    driver: bridge
