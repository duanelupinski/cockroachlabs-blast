# Local insecure MCP demo: 3× us-east, one node per zone.
# Never start this with TLS. Demos use --insecure only.
x-node: &node
  image: cockroachdb/cockroach:${CRDB_VERSION:-v26.1.5}
  labels:
    - "managed-by=cockroach-blast"
    - "blast-demo=mcp"
  networks:
    - blast-net
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 3s
    timeout: 3s
    retries: 20

services:
  blast-node-1:
    <<: *node
    container_name: blast-node-1
    hostname: blast-node-1
    command: >
      start --insecure
      --join=blast-node-1:26357,blast-node-2:26357,blast-node-3:26357
      --listen-addr=0.0.0.0:26357 --advertise-addr=blast-node-1:26357
      --sql-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --store=node1
      --locality=region=us-east,zone=us-east-1
      --cache=64MiB --max-sql-memory=256MiB

  blast-node-2:
    <<: *node
    container_name: blast-node-2
    hostname: blast-node-2
    command: >
      start --insecure
      --join=blast-node-1:26357,blast-node-2:26357,blast-node-3:26357
      --listen-addr=0.0.0.0:26357 --advertise-addr=blast-node-2:26357
      --sql-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --store=node2
      --locality=region=us-east,zone=us-east-2
      --cache=64MiB --max-sql-memory=256MiB

  blast-node-3:
    <<: *node
    container_name: blast-node-3
    hostname: blast-node-3
    command: >
      start --insecure
      --join=blast-node-1:26357,blast-node-2:26357,blast-node-3:26357
      --listen-addr=0.0.0.0:26357 --advertise-addr=blast-node-3:26357
      --sql-addr=0.0.0.0:26257 --http-addr=0.0.0.0:8080 --store=node3
      --locality=region=us-east,zone=us-east-3
      --cache=64MiB --max-sql-memory=256MiB

  blast-init:
    image: cockroachdb/cockroach:${CRDB_VERSION:-v26.1.5}
    container_name: blast-init
    profiles: ["init"]
    labels:
      - "managed-by=cockroach-blast"
      - "blast-demo=mcp"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cockroach init --insecure --host=blast-node-1:26357 || true
        i=0
        until cockroach sql --insecure --host=blast-node-1:26257 -e 'SELECT 1'; do
          i=$$((i+1))
          if [ "$$i" -ge 30 ]; then
            echo "SQL did not become ready on blast-node-1:26257" >&2
            exit 1
          fi
          sleep 2
        done
        cockroach sql --insecure --host=blast-node-1:26257 -e "
          GRANT admin TO root;
          SET CLUSTER SETTING sql.restrict_system_interface.enabled = false;
          CREATE USER IF NOT EXISTS mcp_demo;
          GRANT SYSTEM VIEWACTIVITY TO mcp_demo;
          GRANT SYSTEM VIEWCLUSTERMETADATA TO mcp_demo;
          DROP DATABASE IF EXISTS tpcc CASCADE;
          CREATE DATABASE tpcc;
        "
        cockroach workload init tpcc --warehouses=1 --data-loader=INSERT \
          'postgresql://root@blast-node-1:26257/tpcc?sslmode=disable'
        cockroach sql --insecure --host=blast-node-1:26257 --database=tpcc -e "
          GRANT CONNECT ON DATABASE tpcc TO mcp_demo;
          GRANT USAGE ON SCHEMA public TO mcp_demo;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO mcp_demo;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO mcp_demo;
          REVOKE INSERT, UPDATE, DELETE, CREATE, DROP ON ALL TABLES IN SCHEMA public FROM mcp_demo;
          REVOKE CREATE ON SCHEMA public FROM mcp_demo, public;
          REVOKE CREATE, DROP ON DATABASE tpcc FROM mcp_demo, public;
        "
    depends_on:
      blast-node-1:
        condition: service_healthy
      blast-node-2:
        condition: service_healthy
      blast-node-3:
        condition: service_healthy
    networks:
      - blast-net

  blast-lb:
    image: haproxy:2.9
    container_name: blast-lb
    labels:
      - "managed-by=cockroach-blast"
      - "blast-demo=mcp"
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - ./haproxy-mcp.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - blast-net
    depends_on:
      blast-node-1:
        condition: service_healthy
      blast-node-2:
        condition: service_healthy
      blast-node-3:
        condition: service_healthy

  blast-workload:
    image: cockroachdb/cockroach:${CRDB_VERSION:-v26.1.5}
    container_name: blast-workload
    hostname: blast-workload
    labels:
      - "managed-by=cockroach-blast"
      - "blast-demo=mcp"
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]
    networks:
      - blast-net

networks:
  blast-net:
    driver: bridge
