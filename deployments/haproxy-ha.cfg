global
    maxconn 4096

defaults
    mode tcp
    timeout connect 10s
    timeout client  30m
    timeout server  30m
    option clitcpka

listen crdb-sql
    bind *:26257
    mode tcp
    balance roundrobin
    retries 3
    option redispatch
    timeout connect 1s
    option httpchk GET /health
    default-server inter 1s fall 1 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none
    server blast-node-1 blast-node-1:26257 check port 8080
    server blast-node-2 blast-node-2:26257 check port 8080
    server blast-node-3 blast-node-3:26257 check port 8080
    server blast-node-4 blast-node-4:26257 check port 8080
    server blast-node-5 blast-node-5:26257 check port 8080
    server blast-node-6 blast-node-6:26257 check port 8080
    server blast-node-7 blast-node-7:26257 check port 8080
    server blast-node-8 blast-node-8:26257 check port 8080
    server blast-node-9 blast-node-9:26257 check port 8080
    server blast-node-10 blast-node-10:26257 check port 8080
    server blast-node-11 blast-node-11:26257 check port 8080
    server blast-node-12 blast-node-12:26257 check port 8080

listen crdb-ui
    bind *:8080
    mode tcp
    balance first
    retries 3
    option redispatch
    timeout connect 1s
    timeout client  15s
    timeout server  15s
    option httpchk GET /health
    default-server inter 500ms fall 1 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none
    server blast-node-1 blast-node-1:8080 check port 8080
    server blast-node-2 blast-node-2:8080 check port 8080
    server blast-node-3 blast-node-3:8080 check port 8080
    server blast-node-4 blast-node-4:8080 check port 8080
    server blast-node-5 blast-node-5:8080 check port 8080
    server blast-node-6 blast-node-6:8080 check port 8080
    server blast-node-7 blast-node-7:8080 check port 8080
    server blast-node-8 blast-node-8:8080 check port 8080
    server blast-node-9 blast-node-9:8080 check port 8080
    server blast-node-10 blast-node-10:8080 check port 8080
    server blast-node-11 blast-node-11:8080 check port 8080
    server blast-node-12 blast-node-12:8080 check port 8080
